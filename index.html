<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Azure Website</title>

    <style>
        body{
            margin:0;
            font-family: Arial, sans-serif;
            background:#f4f4f4;
        }

        header{
            background:#0078D4;
            color:white;
            text-align:center;
            padding:20px;
        }

        nav{
            background:#333;
            padding:10px;
            text-align:center;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:15px;
        }

        .container{
            padding:40px;
            text-align:center;
        }

        .card{
            background:white;
            padding:20px;
            max-width:600px;
            margin:auto;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        footer{
            background:#222;
            color:white;
            text-align:center;
            padding:15px;
            margin-top:30px;
        }
    </style>
</head>
<body>

<header>
    <h1>Welcome to My Azure Web App</h1>
    <p>HTML Website Hosted on Microsoft Azure</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
</nav>

<div class="container">
    <div class="card">
        <h2>Hello!</h2>
        <p>
            This website is created using HTML and CSS and deployed
            on Microsoft Azure App Service.
        </p>

        <h3>Created By</h3>
        <p>Huzaifa Usman</p>
    </div>
</div>

<footer>
    <p>© 2026 My Azure Website. All Rights Reserved.</p>
</footer>

</body>
</html>
